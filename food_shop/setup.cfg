[flake8]
ignore =
    W503, D100, D101, D102, D103, D104, D105, D106, I001, I002, I003, I004, I005
exclude =
    tests/,
    */migrations/,
    data/
    venv/,
    env/,
    docs/,
per-file-ignores =
    */settings.py:E501

[isort]
profile = black
src_paths  = ['api', 'food_shops']
lines_between_sections = 1
sections = FUTURE, STDLIB, THIRDPARTY, FIRSTPARTY, LOCALFOLDER
known_first_party = api
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["migrations"]
